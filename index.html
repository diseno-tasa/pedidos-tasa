<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Pedidos de Material — Astillero TASA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#0f1b2d;--muted:#4b5a6b;--line:#d9e0e7;--navy:#154378;--navy2:#1d5597;--accent:#5f8c1a;--ok:#1f8a70;--warn:#c98a12;--bad:#c0392b;--info:#2d6cdf;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px}
.mono{font-family:'IBM Plex Mono',monospace}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc0ff;border-color:#6a9cf0}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:20}
.top .brand{font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.top .brand i{display:inline-block;width:10px;height:22px;background:var(--accent);border-radius:2px}
.top .sp{flex:1}
.top .who{font-size:12px;opacity:.9;text-align:right;line-height:1.3}
.top select{width:auto;background:var(--navy2);color:#fff;border-color:#2c4a77;padding:5px 8px;font-size:12px}
.layout{display:flex;min-height:calc(100vh - 50px)}
nav.side{width:210px;background:#fff;border-right:1px solid var(--line);padding:12px 8px;flex-shrink:0}
nav.side button,nav.bottom button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px;border-radius:8px;color:var(--ink);text-align:left}
nav.side button:hover{background:#f1f4f8}
nav.side button.on{background:#e6edf8;color:var(--navy);font-weight:600}
nav svg{width:18px;height:18px;flex-shrink:0}
nav.bottom{display:none}
main{flex:1;padding:18px;max-width:1280px;min-width:0}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:0 0 10px}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.head .sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f5f7fa}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}.btn.p:hover{background:var(--navy2)}
.btn.a{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.d{color:var(--bad)}
.btn.s{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;border-left:4px solid var(--c,var(--navy))}
.kpi:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.kpi b{display:block;font-size:26px;font-weight:700;line-height:1.1}
.kpi span{font-size:13px;color:var(--ink);font-weight:500}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:8px;border-bottom:1px solid #eef1f4;vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:#f7f9fc}
td input,td select{padding:5px 7px}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;line-height:1.35;white-space:nowrap;background:#e4e9ef;color:#1f2f42;border:1px solid rgba(0,0,0,.08)}
.e-Borrador{background:#e4e8ee;color:#2b3a4c}.e-Enviada{background:#d6e4fc;color:#123c8f}.e-Observada{background:#fbdcd8;color:#7d1a10}.e-Validada{background:#d3efe4;color:#0b4d3a}.e-Exportada{background:#fde7bf;color:#6b4300}.e-Reservada{background:#e3d8fa;color:#3f1d8c}.e-Atendida{background:#c9ead7;color:#08452a}.e-Anulada{background:#e2e2e2;color:#4a4a4a}
.ref{background:#fde7bf;color:#6b4300}
.muted{color:var(--muted)}.small{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.issues{list-style:none;margin:0;padding:0}
.issues li{display:flex;gap:8px;align-items:flex-start;padding:8px 0;font-size:13px;line-height:1.4;border-bottom:1px dashed var(--line)}
.issues li:last-child{border:0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.dot.error{background:var(--bad)}.dot.aviso{background:var(--warn)}.dot.ok{background:var(--ok)}
.bars .b{display:grid;grid-template-columns:120px 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:12px}
.bars .t{background:#eef1f4;border-radius:4px;height:14px;overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--navy2);border-radius:4px}
.ov{position:fixed;inset:0;background:rgba(11,37,69,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 12px;overflow:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:640px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.w{max-width:900px}
.modal h2{font-size:17px;margin-bottom:14px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.conf-alta{background:#d3efe4;color:#0b4d3a}.conf-media{background:#fff1cc;color:#7a5200}.conf-baja{background:#fbdcd8;color:#7d1a10}
.fotoprev{max-width:100%;max-height:260px;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;display:block}
.fotoprev.grande{max-height:none;cursor:zoom-out}
.fotoform{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:14px;align-items:start}
@media(max-width:760px){.fotoform{grid-template-columns:1fr}}
.chip.bsu{background:#dff3ef;color:#0b5345;font-weight:700}
.bsubox{background:#e9f7f3;border:1px solid #9fd8c8;border-radius:10px;padding:10px 12px;color:#0b4535}
#tour{position:fixed;inset:0;z-index:9000}
#tour .tblock{position:fixed;inset:0}
#tour .tspot{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(8,22,45,.62);outline:3px solid #f5b400;transition:all .25s;pointer-events:none}
#tour .tspot.none{box-shadow:0 0 0 9999px rgba(8,22,45,.62);outline:0;width:0!important;height:0!important}
#tour .tbub{position:fixed;background:#fff;border-radius:14px;width:min(380px,calc(100vw - 24px));padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.35);border-top:5px solid var(--accent)}
#tour .tbub h3{margin:0 0 4px;color:var(--navy);font-size:16px}
#tour .tbub p{margin:0;line-height:1.5;font-size:14px}
#tour .tdots{display:flex;gap:4px;margin-top:10px}#tour .tdots i{width:7px;height:7px;border-radius:50%;background:#d5dce6}#tour .tdots i.on{background:var(--accent)}
.accbox{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;background:#f8fafc}
.accbox label{display:flex;gap:6px;align-items:center;font-weight:500;margin:0;font-size:13px}
.accbox input[type=checkbox]{width:auto}
.accsis{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0 22px}
.results{border:1px solid var(--line);border-radius:8px;max-height:260px;overflow:auto;margin-top:6px;background:#fff}
.results div{padding:8px 10px;border-bottom:1px solid #f0f2f5;cursor:pointer;display:flex;gap:10px}
.results div:hover{background:#f3f7fd}
.warn{background:#fff3dc;border:1px solid #ecc77e;color:#5c3d00;border-radius:8px;padding:8px 11px;font-size:13px;margin-top:6px}
.bad{background:#fde6e3;border:1px solid #eea79d;color:#701a10;border-radius:8px;padding:8px 11px;font-size:13px}
.okbox{background:#def2e9;border:1px solid #96d1ba;color:#0b4532;border-radius:8px;padding:8px 11px;font-size:13px}
.result{font-size:28px;font-weight:700;color:var(--navy)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:99;font-size:14px;font-weight:500;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);border:0;color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.tabs button.on{color:var(--navy);border-color:var(--accent)}
.empty{text-align:center;padding:30px;color:var(--muted)}
.hist{font-size:12.5px;color:#2e3d4f;max-height:200px;overflow:auto}
.hist div{padding:3px 0}
.banner{background:#fff3dc;border-bottom:1px solid #ecc77e;color:#5c3d00;padding:8px 16px;font-size:13px}
.formula{font-family:'IBM Plex Mono',monospace;background:#e9edf3;color:#16263b;padding:2px 6px;border-radius:4px;font-size:12.5px}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.center{max-width:460px;margin:60px auto;padding:0 12px}
.scroll{overflow-x:auto}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){
  nav.side{display:none}
  nav.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30;overflow-x:auto;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  nav.bottom button{flex-direction:column;gap:2px;font-size:10px;padding:6px 8px;min-width:68px;align-items:center;text-align:center;color:var(--muted)}
  nav.bottom button.on{color:var(--navy);font-weight:600}
  main{padding:12px 12px 90px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top .who .nm,.top .brand .nm{display:none}.top{gap:8px;padding:8px 10px}.top .who{font-size:11px}
  table.rs thead{display:none}
  table.rs tr{display:block;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;padding:6px;background:#fff}
  table.rs td{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;padding:4px 6px}
  table.rs td::before{content:attr(data-l);font-size:11px;color:var(--muted);font-weight:600;flex-shrink:0}
  table.rs td input,table.rs td select{max-width:60%}
  .ov{padding:10px}
}

/* ---- Marca TASA ---- */
.lg{position:fixed;inset:0;overflow:auto;background:
  linear-gradient(rgba(103,191,237,.07) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg,rgba(103,191,237,.07) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(rgba(103,191,237,.035) 1px,transparent 1px) 0 0/8px 8px,
  linear-gradient(90deg,rgba(103,191,237,.035) 1px,transparent 1px) 0 0/8px 8px,
  radial-gradient(ellipse at 20% 10%,#1d5597 0%,#154378 45%,#0b2a52 100%);color:#fff}
.lg-art{position:fixed;left:0;right:0;bottom:0;width:100%;height:auto;max-height:48vh;pointer-events:none;opacity:.5}
.lg::after{content:'';position:fixed;left:0;right:0;bottom:0;height:48vh;background:linear-gradient(to bottom,rgba(11,42,82,0) 0%,rgba(11,42,82,.0) 55%,rgba(11,42,82,.35) 100%);pointer-events:none}
.lg-wrap{position:relative;z-index:1;min-height:100%;display:flex;align-items:center;justify-content:center;gap:72px;padding:10vh 24px 34vh;flex-wrap:wrap}
.lg-brand{max-width:440px;text-shadow:0 2px 14px rgba(5,25,55,.6)}
.lg-brand img{width:132px;height:132px;border-radius:22px;box-shadow:0 14px 40px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.12);display:block}
.lg-brand h1{font-size:34px;line-height:1.15;margin:26px 0 0;font-weight:700;letter-spacing:.2px}
.lg-brand h1 span{display:block;font-weight:400;font-size:22px;color:#cfe6f7;margin-top:4px}
.lg-brand .bar{width:64px;height:4px;background:#7CA22B;border-radius:2px;margin:18px 0 12px}
.lg-brand .sub{font-size:15px;letter-spacing:2.5px;text-transform:uppercase;color:#9fd3f2;font-weight:600}
.lg-card{background:#fff;color:var(--ink);border-radius:16px;padding:26px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(4,20,45,.45)}
.lg-card h2{font-size:18px;margin:0 0 4px}
.lg-card .btn.p{width:100%;justify-content:center;padding:11px;font-size:15px}
.lg-foot{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,.55);z-index:1;letter-spacing:.5px}
@media (max-width:860px){.lg-wrap{flex-direction:column;gap:22px;padding:28px 16px 140px;justify-content:flex-start}
  .lg-brand{text-align:center}.lg-brand img{width:96px;height:96px;margin:0 auto;border-radius:18px}
  .lg-brand h1{font-size:24px;margin-top:16px}.lg-brand h1 span{font-size:17px}.lg-brand .bar{margin:12px auto 8px}.lg-brand .sub{font-size:12px}}
.top .logo{width:30px;height:30px;border-radius:6px;display:block}

.lg-cw{position:relative;width:100%;max-width:380px;margin-top:84px}
.lg-cw .lg-card{position:relative;z-index:1;padding-top:44px}
.rb-head{position:absolute;left:50%;top:-104px;width:132px;transform:translateX(-50%);z-index:0;animation:rbBob 4s ease-in-out infinite}
.rb-arm{position:absolute;top:-22px;height:80px;z-index:2;pointer-events:none;overflow:visible}
.rb-arm.l{left:-16px;width:calc(50% - 22px)}.rb-arm.r{right:-16px;width:calc(50% - 22px);transform:scaleX(-1)}
.rb-hand{position:absolute;top:44px;width:50px;height:50px;z-index:3;pointer-events:none}
.rb-hand.l{left:-34px}.rb-hand.r{right:-34px;transform:scaleX(-1)}
.rb-eye{animation:rbBlink 5s infinite;transform-origin:center;transform-box:fill-box}
.rb-ant{animation:rbGlow 2.4s ease-in-out infinite}
@keyframes rbBob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}
@keyframes rbBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes rbGlow{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.rb-head,.rb-eye,.rb-ant{animation:none}}
@media (max-width:860px){.lg-cw{margin-top:100px;width:calc(100% - 36px)}}

/* ---- Asistente robot ---- */
body{background:linear-gradient(rgba(21,67,120,.035) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(21,67,120,.035) 1px,transparent 1px) 0 0/28px 28px,#eef2f6}
.top{background:linear-gradient(90deg,#123a69,#154378 40%,#1d5597)}
.card{box-shadow:0 1px 2px rgba(16,42,77,.04)}
.bot{display:flex;gap:14px;align-items:center;border:1px solid #cfe0f1;border-radius:16px;padding:10px 16px 10px 10px;margin-bottom:14px;position:relative;overflow:hidden;
  background:linear-gradient(rgba(103,191,237,.10) 1px,transparent 1px) 0 0/18px 18px,linear-gradient(90deg,rgba(103,191,237,.10) 1px,transparent 1px) 0 0/18px 18px,linear-gradient(135deg,#ffffff,#eef6fd)}
.bot .rbw{position:relative;flex-shrink:0;width:80px;height:84px}
.bot .rb{width:80px;height:84px;display:block;animation:rbFloat 3.6s ease-in-out infinite}
.bot .gear{position:absolute;right:-6px;bottom:2px;width:24px;height:24px;animation:spin 3s linear infinite}
.bubble{position:relative;background:#154378;color:#fff;border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.45;max-width:760px;box-shadow:0 4px 14px rgba(21,67,120,.18)}
.bubble:before{content:'';position:absolute;left:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-left:0;border-right-color:#154378}
.bubble b{color:#bfe5fb}.bubble .t{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#9fd3f2;font-weight:600;display:block;margin-bottom:2px}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}.dots i{width:5px;height:5px;border-radius:50%;background:#9fd3f2;animation:dot 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.bot .chips{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.steps{display:flex;align-items:flex-start;margin:12px 0 2px;padding:0 4px}
.st{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;font-size:12px;color:var(--muted);font-weight:500;text-align:center;min-width:0}
.st:before{content:'';position:absolute;top:14px;left:-50%;right:50%;height:3px;background:#d6e0ea;z-index:0}.st:first-child:before{display:none}
.st.done:before,.st.cur:before{background:#7CA22B}
.st.cur:before{background:repeating-linear-gradient(90deg,#7CA22B 0 8px,#bcd98a 8px 16px);background-size:32px 3px;animation:flow 1s linear infinite}
.st .c{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid #d6e0ea;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;font-size:13px;margin-bottom:5px;color:#8a99a8;font-weight:700}
.st.done .c{background:#7CA22B;border-color:#7CA22B;color:#fff}.st.done{color:#2f4a12}
.st.cur .c{border-color:#154378;color:#154378;box-shadow:0 0 0 0 rgba(21,67,120,.45);animation:pulse 1.8s infinite}.st.cur{color:#154378;font-weight:700}
.st.warn .c{border-color:#c0392b;color:#c0392b}
.status{border-radius:16px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes rbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes flow{to{background-position:32px 0}}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(21,67,120,.45)}70%{box-shadow:0 0 0 10px rgba(21,67,120,0)}100%{box-shadow:0 0 0 0 rgba(21,67,120,0)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-18deg)}80%{transform:rotate(10deg)}90%{transform:rotate(-12deg)}}
.rb .arm-w{transform-origin:96px 92px;animation:wave 3.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bot .rb,.bot .gear,.dots i,.st.cur:before,.st.cur .c,.rb .arm-w{animation:none}}
@media (max-width:860px){.bot{padding:8px 10px 8px 6px;gap:10px}.bot .rbw,.bot .rb{width:52px;height:56px}.bubble{font-size:13px;padding:8px 11px}.bot .chips{display:none}.st{font-size:10px}.st .c{width:24px;height:24px;font-size:11px}.st:before{top:11px}}
/* ---- Ajustes para celular ---- */
html,body{max-width:100%;overflow-x:hidden}
.layout,main,.card,.grid>*{min-width:0}
.card table{max-width:100%}
@media (max-width:860px){
  html{-webkit-text-size-adjust:100%}
  input,select,textarea{font-size:16px}
  [style*="grid-template-columns"]{grid-template-columns:minmax(0,1fr)!important}
  .top{padding:8px 10px;gap:8px}
  .top .brand{font-size:15px;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .top select{display:none}
  .top .who{font-size:11px;line-height:1.2;max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Última Pos. del grafo según el listado de actividades de la embarcación (el Reservatron la usa para ubicar los nodos nuevos) */
function ultimaPos(h){const e=embBy(h.proyecto);if(!e)return null;const g=String(h.grafo||'').replace(/\D/g,'');
  const s=(e.sistemas||[]).find(x=>g&&String(x.grafo||'').replace(/\D/g,'')===g)||(e.sistemas||[]).find(x=>norm(x.nombre)===norm(h.sistema));

/* ============ Evaluador de fórmulas (sin eval) ============ */
function evalFormula(src,vars){
  const s=String(src||'').replace(/\s+/g,'');
  const toks=s.match(/\d+(?:\.\d+)?(?:e[+-]?\d+)?|[A-Za-z_]\w*|[-+*/^(),]/gi)||[];
  if(toks.join('')!==s)throw new Error('Carácter no permitido en la fórmula');
  let i=0;const peek=()=>toks[i],eat=t=>{if(toks[i]!==t)throw new Error('Se esperaba "'+t+'"');i++};
  const F={ceil:Math.ceil,floor:Math.floor,sqrt:Math.sqrt,abs:Math.abs,min:Math.min,max:Math.max,round:(x,d=0)=>Math.round(x*10**d)/10**d};
  function expr(){let v=term();while(peek()==='+'||peek()==='-'){const o=toks[i++];const r=term();v=o==='+'?v+r:v-r}return v}
  function term(){let v=pow();while(peek()==='*'||peek()==='/'){const o=toks[i++];const r=pow();v=o==='*'?v*r:v/r}return v}
  function pow(){const b=unary();if(peek()==='^'){i++;return b**pow()}return b}
  function unary(){if(peek()==='-'){i++;return -unary()}if(peek()==='+'){i++;return unary()}return prim()}
  function prim(){const t=toks[i++];if(t==null)throw new Error('Fórmula incompleta');
    if(/^\d/.test(t))return parseFloat(t);
    if(t==='('){const v=expr();eat(')');return v}
    if(/^[A-Za-z_]/.test(t)){
      if(peek()==='('){const f=F[t.toLowerCase()];if(!f)throw new Error('Función desconocida: '+t);i++;const args=[];if(peek()!==')'){args.push(expr());while(peek()===','){i++;args.push(expr())}}eat(')');return f(...args)}
      if(t==='PI')return Math.PI;
      if(!(t in vars))throw new Error('Variable desconocida: '+t);
      const v=Number(vars[t]);if(isNaN(v))throw new Error('Falta valor para '+t);return v}
    throw new Error('Símbolo inesperado: '+t)}
  const v=expr();if(i<toks.length)throw new Error('Sobra "'+toks[i]+'"');if(!isFinite(v))throw new Error('Resultado no válido');return v}
const parseConsts=t=>{const o={};String(t||'').split(/[;\n]/).forEach(p=>{const m=p.match(/^\s*([A-Za-z_]\w*)\s*=\s*(-?[\d.,]+)\s*$/);if(m)o[m[1]]=num(m[2])});return o};

/* Advertencias de unidades: detecta metros vs milímetros */
function dimWarn(k,val,unit,calc){const v=num(val);if(!v)return '';
  if(unit==='m'&&v>=20)return `${v} m es demasiado grande — ¿quiso decir ${v} mm?`;
  if(unit==='mm'&&v<10)return `${v} mm es demasiado pequeño — ¿quiso decir ${v} m?`;
  const m=unit==='mm'?v/1000:unit==='cm'?v/100:v;const c=(calc&&calc.consts)||{};
  if(k==='L'&&c.PL&&m>c.PL*1.001)return `El largo (${fmt(m)} m) excede la plancha (${c.PL} m)`;
  if(k==='A'&&c.PA&&m>c.PA*1.001)return `El ancho (${fmt(m)} m) excede el ancho del material (${c.PA} m)`;
  return ''}
const toM=(v,u)=>{v=num(v);return u==='mm'?v/1000:u==='cm'?v/100:v};
/* Interpreta observaciones tipo "320 x 1500", "0.32x1.5 m", "3 mt" */
function parseObs(obs){const s=String(obs||'').toLowerCase().replace(',','.');
  const u=x=>x?(x.startsWith('mm')?'mm':x.startsWith('cm')?'cm':'m'):null;
  let m=s.match(/(\d+(?:\.\d+)?)\s*(mm|cm|mts?|m)?\s*[x×*]\s*(\d+(?:\.\d+)?)\s*(mm|cm|mts?|m)?/);
  if(m){const ug=u(m[4])||u(m[2]);const a=+m[1],b=+m[3];
    const ua=ug||(a>=10?'mm':'m'),ub=ug||(b>=10?'mm':'m');
    const notes=[];let A1=ua,B1=ub;if(ua==='m'&&a>=20){A1='mm';notes.push(`${a} m interpretado como mm`)}if(ub==='m'&&b>=20){B1='mm';notes.push(`${b} m interpretado como mm`)}
    return {tipo:'area',L:toM(a,A1),A:toM(b,B1),raw:m[0],notes}}
  m=s.match(/(\d+(?:\.\d+)?)\s*(mm|cm|mts?|m)\b/);
  if(m){let un=u(m[2]);const v=+m[1];const notes=[];if(un==='m'&&v>=50){un='mm';notes.push(`${v} m interpretado como mm`)}return {tipo:'lineal',L:toM(v,un),raw:m[0],notes}}
  return null}

/* ============ Contraseñas ============ */
async function hashPw(pw,salt){const enc=new TextEncoder();
  if(!(window.crypto&&crypto.subtle))throw new Error('Este navegador no permite cifrado seguro');
  const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const genPw=()=>{const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';const a=new Uint32Array(10);crypto.getRandomValues(a);a.forEach(x=>s+=c[x%c.length]);return s};

/* ============ Base de datos ============ */
function memDB(){const store=new Map(),subs=new Set();let t=0;
  const notify=()=>{clearTimeout(t);t=setTimeout(()=>subs.forEach(f=>f()),0)};
  const snap=(p,v)=>({id:p.slice(p.lastIndexOf('/')+1),exists:v!==undefined,data:()=>v,metadata:{fromCache:false,hasPendingWrites:false}});
  const docRef=path=>({id:path.slice(path.lastIndexOf('/')+1),path,
    get:async()=>snap(path,store.get(path)),
    set:async d=>{store.set(path,clone(d));notify()},
    update:async d=>{store.set(path,{...store.get(path),...clone(d)});notify()},
    delete:async()=>{store.delete(path);notify()},
    onSnapshot(cb){const f=()=>cb(snap(path,store.get(path)));subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}});
  return {doc:docRef,collection:col=>({path:col,doc:id=>docRef(col+'/'+(id||rid())),
    onSnapshot(cb){const f=()=>{const docs=[...store.entries()].filter(([p])=>p.slice(0,p.lastIndexOf('/'))===col).map(([p,v])=>snap(p,v));cb({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false}})};subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}})}}
const wq={};
function W(path,fn){S.pend=(S.pend||0)+1;const t0=Date.now();const tw=setTimeout(()=>{S.lento=true;schedule()},8000);const p=(wq[path]||Promise.resolve()).then(fn);p.then(()=>{S.ultSync=new Date()},()=>{}).finally(()=>{clearTimeout(tw);S.pend--;if(!S.pend)S.lento=false;schedule()});wq[path]=p.catch(()=>{});return p.catch(e=>{

const setDoc=(path,data)=>W(path,()=>S.db.doc(path).set(clone(data)));
const delDoc=path=>W(path,()=>S.db.doc(path).delete());

function vInicio(){
  const L=visibles(),act=L.filter(s=>s.estado!=='Anulada');
  const issuesOf=s=>revisar(s);
  const sinGP=act.filter(s=>['Enviada','Borrador','Observada'].includes(s.estado)&&(!s.header.grafo||!s.header.pos)).length;

function tablaSol(L,issuesOf){return `<div class="scroll"><table class="rs"><thead><tr><th>Fecha</th><th>Periodo</th><th>Embarcación</th><th>Sistema</th><th>Grafo / Pos</th><th>Actividad</th><th>Empresa</th><th>Ítems</th><th>Reserva</th><th>Estado</th><th>Revisión</th></tr></thead><tbody>

  if(f.emb)L=L.filter(s=>(s.header.proyecto||'(sin embarcación)')===f.emb);

  L=[...L].sort((a,b)=>(b.fechaSolicitud||'').localeCompare(a.fechaSolicitud||''));

  <div class="card">${L.length?tablaSol(L):'<div class="empty">No hay solicitudes con estos filtros.</div>'}</div>`}

/* ---------- Revisión automática ---------- */
function revisar(s){const I=[],h=s.header||{};const pre=['Borrador','Observada'].includes(s.estado),L=pre?'aviso':'error',P=pre?'Pendiente para enviar: ':'';
  if(!h.proyecto)I.push({n:L,envio:1,m:P+'falta la embarcación (proyecto).'});
  const emb=h.proyecto&&embBy(h.proyecto);
  if(h.proyecto&&!emb)I.push({n:'aviso',m:`La embarcación "${h.proyecto}" no está registrada.`});
  if(emb&&estProy(emb)==='Cerrado'&&!['Atendida','Anulada','Reservada'].includes(s.estado))I.push({n:'error',m:`El proyecto ${emb.nombre} está CERRADO: no se reciben solicitudes ni reservas.`});
  else if(emb&&estProy(emb)==='Por cerrar')I.push({n:'aviso',m:`El proyecto ${emb.nombre} está por cerrar.`});
  if(!h.sistema)I.push({n:L,m:pre?'Sistema sin definir: el planificador lo asignará.':'Falta el sistema.'});
  const sis=emb&&(emb.sistemas||[]).find(x=>norm(x.nombre)===norm(h.sistema));
  if(emb&&h.sistema&&!sis)I.push({n:'aviso',m:`El sistema "${h.sistema}" no existe en ${emb.nombre}.`});
  if(h.proyecto&&s.empresaId&&accEmp(s.empresaId)&&!['Anulada','Atendida','Reservada'].includes(s.estado)){const pl0=can('validar'),en=(empBy(s.empresaId)||{}).nombre||'La empresa';const nv=pl0?'aviso':'error';
   if(!permEmb(s.empresaId,h.proyecto))I.push({n:nv,envio:pl0?0:1,m:`🔒 ${en} no tiene acceso para solicitar material en ${h.proyecto}.`});
   else if(h.sistema&&!permSis(s.empresaId,h.proyecto,h.sistema))I.push({n:nv,envio:pl0?0:1,m:`🔒 ${en} no tiene acceso al sistema ${h.sistema} de ${h.proyecto}.`});
   else if(!h.sistema&&sisPerm(s.empresaId,h.proyecto))I.push({n:pl0?'aviso':L,envio:pl0?0:1,m:`🔒 Elija el sistema: ${en} solo tiene acceso a algunos sistemas de ${h.proyecto}.`})}
  if(!h.grafo)I.push({n:L,m:pre?'Grafo sin definir: el planificador lo asignará.':'Falta el grafo.',fix:sis&&sis.grafo?{k:'setGrafo',v:sis.grafo,l:'Usar '+sis.grafo}:null});
  else if(sis&&sis.grafo&&String(sis.grafo)!==String(h.grafo))I.push({n:'aviso',m:`El grafo ${h.grafo} no coincide con el del sistema (${sis.grafo}).`,fix:{k:'setGrafo',v:sis.grafo,l:'Usar '+sis.grafo}});
  if(!h.pos){let sug=null;if(sis&&h.nombreActividad){sug=bestAct(sis,h.nombreActividad+' '+(h.consideraciones||''))}
    I.push({n:L,m:(pre?'Actividad (Pos.) sin definir: el planificador la asignará':'Falta la Pos. (actividad)')+(h.actividadTentativa?` — tentativa: "${h.actividadTentativa}"`:'')+'.',fix:sug?{k:'setPos',v:sug.pos,l:`Usar Pos ${sug.pos} — ${sug.nombre}`}:null})}
  if(!(s.items||[]).length)I.push({n:'error',m:'La solicitud no tiene materiales.'});
  (s.items||[]).forEach((it,i)=>{const tag=`Ítem ${i+1} (${it.codigo||'REF'} ${String(it.desc||'').slice(0,28)})`;
    if(!it.codigo){I.push({n:pre?'aviso':'error',m:`${tag}: material referencial sin código SAP${pre?' (el planificador le asignará el código)':''}.`,fix:can('editar_mat')?{k:'asignarRef',i,l:'Asignar código'}:null});}
    const m=matBy(it.codigo);
    if(it.codigo&&!m&&!it.bsu)I.push({n:'aviso',m:`${tag}: el código no está en el catálogo.`,fix:can('editar_mat')?{k:'addMat',i,l:'Agregar al catálogo'}:null});
    if(m&&m.um&&it.um&&m.um!==it.um)I.push({n:'aviso',m:`${tag}: UM "${it.um}" distinta al catálogo (${m.um}).`,fix:{k:'setUm',i,v:m.um,l:'Usar '+m.um}});
    const q=num(it.cantidad);
    if(!(q>0))I.push({n:'error',m:`${tag}: cantidad vacía o no válida.`});
    else if(UM_ENTERA.includes(it.um)&&q%1!==0&&!(m&&m.calc))I.push({n:'aviso',m:`${tag}: cantidad decimal (${it.cantidad}) en unidad entera ${it.um}.`});
    if(m&&m.calc&&it.obs&&!it.calc){const p=parseObs(it.obs);if(p){try{const vars={...m.calc.consts,L:p.L,A:p.A??0,D:p.L,N:1};const r=Math.round(evalFormula(m.calc.formula,vars)*1000)/1000;
      if(q>0&&Math.abs(r-q)/Math.max(r,1e-9)>0.03)I.push({n:'aviso',m:`${tag}: según "${p.raw}" corresponde ${fmt(r)} ${m.um}, se pidió ${it.cantidad}.${p.notes.length?' ('+p.notes.join('; ')+')':''}`,fix:{k:'setCant',i,v:fmt(r),l:'Aplicar '+fmt(r)}});
      else if(p.notes.length)I.push({n:'aviso',m:`${tag}: ${p.notes.join('; ')}.`});}catch(e){}}}
    if(it.calc&&it.calc.warn)I.push({n:'aviso',m:`${tag}: ${it.calc.warn}`});
    if(sigueBloq(it))I.push({n:'aviso',m:`${tag}: código bloqueado en SAP hace ${diasDesde((it.bloqueo||{}).desde)} día(s) — pendiente de desbloqueo.`});
    else if(isBloq(it))I.push({n:'aviso',m:`${tag}: desbloqueado — falta la carga posterior.`});
    else if(m&&m.sapBloq&&!it.reserva&&['Bloqueado','Desbloqueo solicitado'].includes(m.sapBloq.estado))I.push({n:'aviso',m:`${tag}: este código figura BLOQUEADO en SAP desde ${fdt(m.sapBloq.desde)}.`});
  });
  return I}
function bestAct(sis,txt){const tk=new Set(norm2(txt));let best=null,bs=0;(sis.actividades||[]).forEach(a=>{const sc=norm2(a.nombre).filter(w=>tk.has(w)).length;if(sc>bs){bs=sc;best=a}});return bs>=2?best:((sis.actividades||[]).length===1?sis.actividades[0]:null)}
function norm2(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>2)}

  <p class="muted" style="margin-top:-6px">Guarde como plantilla las solicitudes de actividades que se repiten (desde el botón “☆ Guardar como plantilla” de una solicitud). Al usarla se crea un borrador con los mismos materiales y solo ajusta las cantidades.</p>

  ${L.length?`<div class="scroll"><table class="rs"><thead><tr><th>Plantilla</th><th>Actividad</th><th>Embarcación / sistema / Pos.</th><th>Materiales</th><th>Creada por</th><th>Visible para</th><th></th></tr></thead><tbody>${L.map(p=>`<tr>

   <td data-l="Asignación">${p.proyecto?esc(p.proyecto)+(p.sistema?' / '+esc(p.sistema):'')+(p.pos?' / Pos '+esc(p.pos):''):'<span class="muted">Sin asignación</span>'}</td>

function vFormulas(){const T=tpls();
  return `<div class="head"><h1>Plantillas de cálculo</h1><div class="sp"></div><button class="btn a" data-act="tplModal">+ Plantilla</button></div>
  <div class="card small"><b>Cómo funcionan:</b> las medidas <span class="formula">L</span> (largo), <span class="formula">A</span> (ancho) y <span class="formula">D</span> (diámetro) llegan siempre en <b>metros</b> (la app convierte desde mm/cm y avisa si la medida parece estar en la unidad equivocada). <span class="formula">N</span> = número de piezas. Las constantes (p. ej. <span class="formula">PL</span>, <span class="formula">PA</span> = largo y ancho de la plancha; <span class="formula">KGM</span> = kg por metro; <span class="formula">E</span> = espesor en mm) se ajustan por material. Funciones: <span class="formula">ceil floor round(x,d) min max sqrt abs PI</span>.</div>

function botVista(v){const c=miCuenta()||{},nom=esc(String(c.nombre||'').split(' ')[0]||'');const L=visibles().filter(s=>s.estado!=='Anulada');const n=e=>L.filter(s=>estadoEf(s)===e).length;

    return enProc?botHTML(`¡Hola${nom?', '+nom:''}! Tienes <b>${enProc}</b> pedido(s) siendo atendidos${res?` y <b>${res}</b> con reserva lista`:''}${bor?`. Además <b>${bor}</b> borrador(es) por completar`:''}.`,{working:true}):
      botHTML(res?`¡Hola${nom?', '+nom:''}! Tienes <b>${res}</b> pedido(s) con reserva lista para copiar.`:`¡Hola${nom?', '+nom:''}! ¿Armamos un pedido? Toca <b>Nueva</b> o parte de una plantilla.`,{mood:'happy'})}
  if(v==='solicitudes'){if(enProc)return botHTML(can('validar')?`Estoy procesando <b>${enProc}</b> solicitud(es) activas: revisión, carga y reserva. Abre cualquiera para ver su avance.`:`<b>Tu pedido está siendo atendido.</b> Tienes ${enProc} solicitud(es) en proceso; te muestro aquí cuando tengan reserva y posición.`,{working:true,title:'Pedidos en atención'});
    return botHTML(res?`Tienes <b>${res}</b> pedido(s) con reserva. Ábrelos para copiar la reserva / pos.`:`No hay pedidos en proceso en este momento. ${can('crear')?'Cuando envíes uno, yo lo sigo por ti.':''}`,{mood:'happy',title:'Pedidos en atención'})}
  if(v==='mejoras')return botHTML(`¿Qué le gustaría que la app haga por usted? Cuénteme su idea y el equipo de Diseño la evaluará. Las propuestas con más 👍 se priorizan.`,{mood:'happy',title:'Buzón de mejoras'});
  if(v==='bloqueos'&&!(can('reserva')||can('validar'))){const sb=bloqueosTodos().length,rp=refsPend().length,nl=libNuevos().length;
    return botHTML(nl?`🎉 <b>${nl}</b> material(es) ya tienen reserva. Cópielos desde la tabla de liberados.`:(sb||rp)?`Estoy pendiente de <b>${sb}</b> código(s) bloqueado(s) en SAP y <b>${rp}</b> material(es) sin código. Le aviso aquí apenas tengan reserva.`:'No tiene materiales pendientes. ¡Todo con reserva! 🎉',{mood:nl||!(sb||rp)?'happy':'ok',working:!!(sb||rp),title:'Mis pendientes'})}
  if(v==='bloqueos'){const L=bloqueosTodos(),sb=L.filter(x=>sigueBloq(x.it)).length;return botHTML(sb?`Estoy vigilando <b>${sb}</b> código(s) bloqueado(s) en SAP. Cuando se desbloqueen, márquelos como <b>Desbloqueado</b> y yo preparo el Excel de carga posterior.`:(L.length?`Todo desbloqueado: <b>${L.length}</b> ítem(s) esperan la carga posterior.`:'No hay códigos bloqueados. ¡Todo fluye! 🎉'),{mood:sb?'worry':'happy',working:!!sb,title:'Bloqueos SAP'})}

const PASOS=[['Borrador','Registro'],['Enviada','Solicitado'],['Validada','Validada'],['Exportada','Cargada'],['Reservada','Reservada ✔']];
function estadoPanel(s){const e=s.estado,pl=can('validar');let idx=PASOS.findIndex(p=>p[0]===e);if(e==='Observada')idx=1;
  const res=resumenReserva(s),falta=revisar(s).some(x=>x.envio);let msg='',mood='ok',working=false,title='Estado de tu pedido';
  if(cerrada(s)){msg='El proyecto de esta embarcación está <b>cerrado</b>: la solicitud queda solo para consulta.';mood='worry'}
  else switch(e){
   case 'Borrador':msg=falta?`${S.isNew?'¡Vamos armando tu pedido! ':''}Cuando definas la embarcación y la actividad (Pos.) podrás enviarlo. Mientras tanto lo guardo automáticamente.`:'Todo listo ✔ Presiona <b>Enviar solicitud</b> y yo me encargo de avisar a los encargados.';mood=falta?'ok':'happy';break;
   case 'Enviada':msg=pl?`Pedido recibido. ${!s.header.pos?'Asígnale la actividad (grafo y Pos.) y ':'Revisa los materiales y '}valídalo para preparar la carga.`:'<b>¡Recibido! Tu pedido está siendo atendido.</b> Mientras el planificador no lo revise, aún puedes <b>corregirlo</b>: agregar materiales olvidados o cambiar la embarcación (se guarda solo).';working=true;break;
   case 'Observada':msg=`Tu pedido tiene observaciones${s.observacion?': <b>'+esc(s.observacion)+'</b>':''}. Corrígelo y vuelve a enviarlo.`;mood='worry';break;
   case 'Validada':msg='Pedido validado ✔ Preparando el archivo para la carga de la reserva…';working=true;break;
   case 'Exportada':msg='Cargando la reserva en el sistema… En cuanto tenga el número de reserva y las posiciones las verás aquí.';working=true;break;
   case 'Reservada':msg=`¡Listo! ${res?'Reserva <b>'+esc(res)+'</b> generada.':'Reserva generada.'} Usa <b>📋 Copiar reserva / pos</b> para pegarla en tu sistema.`;mood='happy';break;
   case 'Atendida':msg='Pedido atendido por completo. ¡Gracias! 🎉';mood='happy';break;
   case 'Anulada':msg='Esta solicitud fue anulada.';mood='worry';break}
  {const nb=(s.items||[]).filter(isBloq);if(nb.length&&!cerrada(s)&&!['Borrador','Enviada','Observada','Anulada'].includes(e)){const sb=nb.filter(sigueBloq).length;
   msg+=`<br>${sb?`🔒 <b>${sb}</b> código(s) bloqueado(s) en SAP: hago seguimiento hasta su desbloqueo.`:''}${nb.length-sb?` 🔓 <b>${nb.length-sb}</b> desbloqueado(s) listo(s) para la carga posterior.`:''}`;if(sb)mood='worry'}}
  const steps=e==='Anulada'?'':`<div class="steps">${PASOS.map((p,i)=>{const cls=i<idx?'done':i===idx?(e==='Observada'?'cur warn':'cur'):'';return `<div class="st ${cls}"><div class="c">${i<idx?'✓':i===idx&&e==='Observada'?'!':i+1}</div>${i===1&&e==='Observada'?'Observada':p[1]}</div>`}).join('')}</div>`;
  return `<div class="card status" style="padding:12px 14px">${botHTML(msg,{mood,working,title}).replace('class="bot"','class="bot" style="margin:0;border:0;padding:0;background:none"')}${steps}</div>`}

function filasLista(rows){return rows.map(r=>({codigo:String(cell(r.codigo||r.codigosap||r.material||r.cod||'')).trim(),desc:String(cell(r.textobrevedematerial||r.descripcion||r.textobreve||r.material_descripcion||r.desc||'')).trim(),
  um:umNorm(cell(r.unmedidadeentrada||r.um||r.unidad||r.unidaddemedida||'')),cantidad:String(cell(r.cantidad||r.cant||r.qty||'')).replace(',','.').trim(),obs:String(cell(r.observaciones||r.obs||r.observacion||r.medidas||'')).trim()}))
  .filter(r=>r.codigo||r.desc)}
function parsePegado(txt){const lines=String(txt||'').split(/\r?\n/).map(l=>l.split('\t')).filter(c=>c.some(x=>x.trim()));if(!lines.length)return [];
  const h=lines[0].map(norm);const conCab=h.some(x=>/cod|desc|cant|texto|unid|obs/.test(x));
  if(conCab)return filasLista(lines.slice(1).map(c=>{const o={};h.forEach((k,i)=>o[k]=c[i]||'');return o}));
  return filasLista(lines.map(c=>({codigo:c[0]||'',descripcion:c[1]||'',cantidad:c[2]||'',observaciones:c[3]||'',um:c[4]||''})))}
function emparejar(f){let m=f.codigo&&matBy(f.codigo),tipo='codigo';
  if(!m&&f.desc){const nd=norm(f.desc);m=S.materiales.find(x=>!x.ref&&norm(x.desc)===nd);tipo='desc';
    if(!m){const r=buscarMat(f.desc.split(/\s+/).slice(0,4).join(' '),{max:2});if(r.total===1){m=r.list[0];tipo='sug'}}}
  const q=num(f.cantidad);const avisos=[];if(!(q>0))avisos.push('cantidad no válida');
  if(m&&f.um&&f.um!==m.um)avisos.push(`UM ${f.um} → se usa ${m.um}`);if(f.codigo&&!m)avisos.push('código no está en catálogo');
  return {...f,m:m||null,tipo:m?tipo:'ref',avisos,ok:q>0&&(!!m||!!f.desc),usar:q>0&&(!!m||!!f.desc)}}

function jsonSuelto(t){t=String(t||'').trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();try{return JSON.parse(t)}catch(e){const i=t.indexOf('{'),j=t.lastIndexOf('}');if(i>=0&&j>i)return JSON.parse(t.slice(i,j+1));throw new Error('La IA no devolvió una respuesta legible.')}}

    const r1=await iaJSON([p1,part]);const L=(r1.lineas||[]).filter(l=>l&&(l.texto||l.descripcion));
    if(!L.length)throw new Error('No se reconocieron materiales en la foto. Intente con una foto más nítida y de frente.');
    const cands=L.map(l=>candidatosCat([...(l.claves||[]),...norm2(l.descripcion||'')]));
    let elec={};if(cands.some(c=>c.length)){
      const p2=`Para cada línea elige el código del catálogo que corresponde (mismo tipo, medida y norma) o null si ninguno corresponde. ${IA_EQUIV}
Responde SOLO con JSON: {"elecciones":[{"linea":número,"codigo":"código o null","alternativas":["otros códigos posibles"],"confianza":"alta|media|baja"}]}
${L.map((l,k)=>`LÍNEA ${k+1}: ${l.cantidad||''} ${l.unidad||''} ${l.texto||l.descripcion} (interpretación: ${l.descripcion||''})\n${cands[k].map(m=>`  - ${m.codigo} | ${m.desc} | ${m.um}`).join('\n')||'  (sin candidatos)'}`).join('\n')}`;
      const r2=await iaJSON([p2]);(r2.elecciones||[]).forEach(e=>{elec[+e.linea]=e})}
    M.rows=L.map((l,k)=>{const e=elec[k+1]||{};const ok=cands[k].some(m=>String(m.codigo)===String(e.codigo));const alts=[...new Set([e.codigo,...(e.alternativas||[]),...cands[k].map(m=>m.codigo)].map(String).filter(c=>c&&c!=='null'&&cands[k].some(m=>String(m.codigo)===c)))];

      return {...r,foto:true,texto:l.texto||l.descripcion,fotoCant:`${l.cantidad||''} ${l.unidad||''}`.trim(),alts,confianza:ok?(e.confianza||'media'):'baja',usar:false}})}
  catch(e){M.fotoErr=iaError(e)}

function bsuCambios(){const out=[];visibles(false).forEach(s=>{if(s.estado==='Anulada')return;(s.items||[]).forEach((it,i)=>{if(it.bsu&&it.bsu.en)out.push({s,it,i})})});return out.sort((a,b)=>String(b.it.bsu.en).localeCompare(String(a.it.bsu.en)))}
const sinCeros=v=>String(v==null?'':v).trim().replace(/\.0+$/,'').replace(/^0+(?=\d)/,'');
function parseResPos(q){const m=String(q||'').trim().match(/^(\d+)(?:\s*[\/\-\s\t,;]\s*(\d+))?$/);return m?{r:sinCeros(m[1]),p:m[2]?sinCeros(m[2]):''}:null}
function buscarResPos(q){const rp=parseResPos(q);if(!rp)return null;const out=[];
  S.solicitudes.forEach(s=>{if(s.estado==='Anulada')return;(s.items||[]).forEach((it,i)=>{if(!it.reserva)return;
    const r=sinCeros(it.reserva),pp=sinCeros(it.posicion),ar=it.bsu&&it.bsu.anterior?sinCeros(it.bsu.anterior.reserva):'',ap=it.bsu&&it.bsu.anterior?sinCeros(it.bsu.anterior.posicion):'';
    if((r===rp.r&&(!rp.p||pp===rp.p))||(ar===rp.r&&(!rp.p||ap===rp.p)))out.push({s,it,i})})});
  return out.sort((a,b)=>(+sinCeros(a.it.posicion)||0)-(+sinCeros(b.it.posicion)||0))}

/* ============ Carga diaria de actividades y grafos (sin reemplazar ni borrar) ============ */
const posKey=p=>{const t=String(p??'').trim();return /^\d+$/.test(t)?String(parseInt(t,10)):t.toUpperCase()};
function planEmb(rows){const base={};S.embarcaciones.forEach(e=>base[norm(e.nombre)]=e);const res={nuevasEmb:[],nuevosSis:[],nuevasAct:[],difGrafo:[],difNombre:[],iguales:0,omitidas:[]};
  const work={};const get=k=>work[k]||(work[k]=clone(base[k]||null));let filas=0;
  rows.forEach((r,ix)=>{const emb=String(cell(r.embarcacion||r.proyecto||r.nave||r.buque||r.remolcador||'')).trim().toUpperCase();
    const sis=String(cell(r.sistema||'')).trim().toUpperCase(),g=String(cell(r.grafo||r.grafos||'')).trim();
    const pos=String(cell(r.pos||r.posicion||r.actividad||r.operacion||r.op||'')).trim(),na=String(cell(r.nombredeactividad||r.descripcionactividad||r.nombreactividad||r.descripcion||r.textobreveoperacion||r.texto||'')).trim();
    if(!emb&&!sis&&!g&&!pos)return;filas++;
    if(!emb||(!sis&&!g)){res.omitidas.push(`Fila ${ix+2}: falta ${!emb?'embarcación':'sistema o grafo'}`);return}
    const k=norm(emb);let e=get(k);if(!e){e=work[k]={id:newId('embarcaciones'),nombre:emb,estado:'Activo',contactos:[],sistemas:[]};res.nuevasEmb.push(emb)}
    e.sistemas=e.sistemas||[];let si=sis?e.sistemas.find(x=>norm(x.nombre)===norm(sis)):e.sistemas.find(x=>String(x.grafo)===g);
    if(!si){si={nombre:sis||('GRAFO '+g),grafo:g,actividades:[]};e.sistemas.push(si);res.nuevosSis.push(`${emb} / ${si.nombre}${g?' (grafo '+g+')':''}`)}
    else if(g&&String(si.grafo||'')!==g){if(!si.grafo){si.grafo=g}else if(!res.difGrafo.some(x=>x.emb===emb&&x.sis===si.nombre))res.difGrafo.push({emb,sis:si.nombre,actual:si.grafo,nuevo:g})}
    if(!pos){res.iguales++;return}
    si.actividades=si.actividades||[];const a=si.actividades.find(x=>posKey(x.pos)===posKey(pos));
    if(!a){si.actividades.push({pos,nombre:na});res.nuevasAct.push(`${emb} / ${si.nombre} / Pos ${pos}${na?' — '+na:''}`)}
    else if(na&&norm(a.nombre)!==norm(na)){if(!a.nombre)a.nombre=na;else res.difNombre.push({emb,sis:si.nombre,pos:a.pos,actual:a.nombre,nuevo:na})}
    else res.iguales++});
  return {work,res,filas}}
function aplicarPlanEmb(P,updG,updN){const out=[];for(const [k,e] of Object.entries(P.work)){if(!e)continue;
    if(updG)P.res.difGrafo.filter(d=>norm(d.emb)===k).forEach(d=>{const si=e.sistemas.find(x=>x.nombre===d.sis);if(si)si.grafo=d.nuevo});
    if(updN)P.res.difNombre.filter(d=>norm(d.emb)===k).forEach(d=>{const si=e.sistemas.find(x=>x.nombre===d.sis);const a=si&&si.actividades.find(x=>posKey(x.pos)===posKey(d.pos));if(a)a.nombre=d.nuevo});
    const prev=S.embarcaciones.find(x=>x.id===e.id);const a=JSON.stringify((prev||{}).sistemas||null),b=JSON.stringify(e.sistemas);if(!prev||a!==b)out.push(e)}return out}
function mImpEmb(M){const r=M.plan.res;const lst=(t,l,c)=>l.length?`<details ${l.length<=8?'open':''} style="margin-top:8px"><summary><b>${t} (${l.length})</b></summary><div class="small" style="max-height:160px;overflow:auto;padding:4px 0 0 14px;color:${c||'inherit'}">${l.map(x=>esc(x)).join('<br>')}</div></details>`:'';
  const cambios=r.nuevasEmb.length+r.nuevosSis.length+r.nuevasAct.length+(M.updGrafo?r.difGrafo.length:0)+(M.updNombre?r.difNombre.length:0);
  return `<h2>Carga de actividades y grafos</h2><p class="small muted" style="margin-top:-8px">Archivo <b>${esc(M.archivo)}</b> · ${M.plan.filas} fila(s) leídas. Solo se <b>agrega</b> lo nuevo; lo que ya existe se conserva y <b>no se elimina nada</b>.</p>
  <div class="kpis" style="margin:10px 0"><div class="kpi" style="--c:var(--ok);cursor:default"><b>${r.nuevasAct.length}</b><span>Actividades nuevas</span></div><div class="kpi" style="--c:var(--info);cursor:default"><b>${r.nuevosSis.length}</b><span>Sistemas nuevos</span></div><div class="kpi" style="--c:var(--navy);cursor:default"><b>${r.nuevasEmb.length}</b><span>Embarcaciones nuevas</span></div><div class="kpi" style="--c:#8a99a8;cursor:default"><b>${r.iguales}</b><span>Ya existían (sin cambios)</span></div></div>
  ${lst('Embarcaciones nuevas',r.nuevasEmb)}${lst('Sistemas nuevos',r.nuevosSis)}${lst('Actividades nuevas',r.nuevasAct)}
  ${r.difGrafo.length?`<div class="warn" style="margin-top:10px"><b>${r.difGrafo.length} sistema(s) con grafo distinto</b> al registrado:<div class="small" style="max-height:120px;overflow:auto">${r.difGrafo.map(d=>`${esc(d.emb)} / ${esc(d.sis)}: actual <b>${esc(d.actual)}</b> → archivo <b>${esc(d.nuevo)}</b>`).join('<br>')}</div>
   <label style="display:flex;gap:6px;align-items:center;font-weight:500;margin:6px 0 0"><input type="checkbox" style="width:auto" data-b="modal.updGrafo" ${M.updGrafo?'checked':''}> Actualizar el grafo con el del archivo (si no, se conserva el actual)</label></div>`:''}
  ${r.difNombre.length?`<div class="warn" style="margin-top:10px"><b>${r.difNombre.length} actividad(es) con nombre distinto</b>:<div class="small" style="max-height:120px;overflow:auto">${r.difNombre.map(d=>`${esc(d.emb)} / ${esc(d.sis)} / Pos ${esc(d.pos)}: “${esc(d.actual)}” → “${esc(d.nuevo)}”`).join('<br>')}</div>
   <label style="display:flex;gap:6px;align-items:center;font-weight:500;margin:6px 0 0"><input type="checkbox" style="width:auto" data-b="modal.updNombre" ${M.updNombre?'checked':''}> Actualizar el nombre con el del archivo (si no, se conserva el actual)</label></div>`:''}
  ${lst('Filas omitidas',r.omitidas,'var(--bad)')}
  <div class="mfoot"><button class="btn" data-act="closeM">Cancelar</button><button class="btn p" data-act="impEmbOK" ${cambios?'':'disabled'}>${cambios?`Aplicar ${cambios} cambio(s)`:'No hay nada nuevo que cargar'}</button></div>`}

/* ============ Enviar correo desde Gmail, Outlook o la app del equipo ============ */
function cuerpoCorto(n){return n.cuerpo.length>1800?n.cuerpo.slice(0,1800)+'\n…':n.cuerpo}
function gmailDe(n){return 'https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(n.para.join(','))+((n.cc||[]).length?'&cc='+encodeURIComponent(n.cc.join(',')):'')+'&su='+encodeURIComponent(n.asunto)+'&body='+encodeURIComponent(cuerpoCorto(n))}

function mailBtns(n){if(!n.para||!n.para.length)return '';const pref=(()=>{try{return localStorage.getItem('pm_mail')||''}catch(e){return ''}})();
  const B=[['gmail',gmailDe(n),'Gmail'],['outlook',outlookDe(n),'Outlook web'],['app',mailtoDe(n),'App de correo']];if(pref)B.sort((a,b)=>(b[0]===pref)-(a[0]===pref));

/* ============ Estado efectivo, retrasos y periodo por embarcación ============ */
const labEst=e=>e==='Enviada'?'Solicitado':e;
const EN_CURSO=['Enviada','Validada','Exportada'];
function completaRes(s){const it=s.items||[];return it.length>0&&it.some(tieneRes)&&it.every(i=>tieneRes(i)||isBloq(i))}
/* ============ Accesos por empresa ============ */
function accEmp(empId){const e=empId&&empBy(empId);const a=e&&e.accesos;return a&&a.restringido?a:null}
function accEnt(a,emb){return (a.lista||[]).find(x=>norm(x.emb)===norm(emb))}
function permEmb(empId,emb){const a=accEmp(empId);if(!a)return true;const x=accEnt(a,emb);return !!(x&&(x.sis||[]).length)}
function sisPerm(empId,emb){const a=accEmp(empId);if(!a)return null;const x=accEnt(a,emb);const l=(x&&x.sis)||[];return l.includes('*')?null:l}
function permSis(empId,emb,sis){if(!permEmb(empId,emb))return false;const l=sisPerm(empId,emb);return !l||l.some(x=>norm(x)===norm(sis))}
function accResumen(e){const a=e.accesos;if(!a||!a.restringido)return '<span class="muted">Todas las embarcaciones</span>';const l=(a.lista||[]).filter(x=>(x.sis||[]).length);if(!l.length)return '<span style="color:var(--bad)">Sin acceso (no puede solicitar)</span>';return l.map(x=>`<b>${esc(x.emb)}</b> <span class="muted">(${x.sis.includes('*')?'todos los sistemas':x.sis.map(esc).join(', ')})</span>`).join('<br>')}
function empConAcceso(emb,sis){return S.empresas.filter(e=>accEmp(e.id)&&permSis(e.id,emb,sis)).map(e=>e.nombre)}
function conReserva(s){const e=estadoEf(s);return e==='Reservada'||e==='Atendida'}
function estadoEf(s){return EN_CURSO.includes(s.estado)&&completaRes(s)?'Reservada':s.estado}
const diasRetraso=()=>{const v=num((S.ajustes||{}).diasRetraso);return v>0?v:3};
function diasEnCurso(s){return diasDesde(s.enviadaEn||s.fechaSolicitud)}
function retrasada(s){const e=estadoEf(s);return EN_CURSO.includes(e)&&!cerrada(s)&&diasEnCurso(s)>diasRetraso()}
function retrasadas(){return visibles().filter(retrasada).sort((a,b)=>diasEnCurso(b)-diasEnCurso(a))}
function retrasoCard(){if(!can('validar'))return '';const L=retrasadas();if(!L.length)return '';
  return `<div class="card" style="border-left:4px solid var(--bad);border-radius:0 12px 12px 0"><div class="row"><h2 style="margin:0">⏰ Actividades retrasadas (${L.length})</h2><span class="small muted">Más de ${diasRetraso()} día(s) desde que se solicitó y aún sin reserva</span></div>
   <div class="scroll" style="margin-top:8px"><table class="rs"><thead><tr><th>Días</th><th>Embarcación</th><th>Actividad</th><th>Empresa</th><th>Estado</th><th>Materiales sin reserva</th><th></th></tr></thead><tbody>${L.map(s=>{const e=empBy(s.empresaId),h=s.header;const sin=(s.items||[]).filter(i=>!i.reserva).length;
   return `<tr><td data-l="Días"><b style="color:var(--bad)">${diasEnCurso(s)}</b></td><td data-l="Embarcación"><b>${esc(h.proyecto||'—')}</b><div class="small muted">${esc(h.sistema||'')}</div></td><td data-l="Actividad">${h.pos?'Pos '+esc(h.pos)+' — ':''}${esc(h.nombreActividad||h.actividadTentativa||'Sin definir')}</td><td data-l="Empresa">${esc(e?e.nombre:(h.empresaTxt||'—'))}</td><td data-l="Estado">${chip(estadoEf(s))}</td><td data-l="Sin reserva">${sin} de ${(s.items||[]).length}</td><td><button class="btn s" data-act="open" data-id="${esc(s.id)}">Abrir</button></td></tr>`}).join('')}</tbody></table></div></div>`}
function periodoEmb(nombre){const e=embBy(nombre);return (e&&e.periodo)||''}

/* ============ Lectura tolerante de columnas Reserva / Posición / Estado ============ */
const BUILD='2026-11-23 19:30';
function colRes(r){for(const k in r){if(k.includes('reserva')&&!/fecha|estado|tipo|clase/.test(k)&&String(r[k]).trim()!=='')return String(cell(r[k])).trim()}return ''}
function colPosRes(r){for(const k of ['posicion','posicionreserva','posreserva','posres','itemreserva','posicionres'])if(r[k]!==undefined&&String(r[k]).trim()!=='')return String(cell(r[k])).trim();
  for(const k in r){if((k.startsWith('posicion')||(k.includes('pos')&&k.includes('res')))&&String(r[k]).trim()!=='')return String(cell(r[k])).trim()}return ''}
function colEst(r){for(const k in r){if(k.startsWith('estado')&&String(r[k]).trim()!=='')return String(cell(r[k])).trim()}return ''}
const tieneRes=it=>!!it.reserva||/^reserv/i.test(String(it.estado||''));
/* ============ Modales ============ */
function modalHTML(){const M=S.modal;let body='';
  if(M.t==='calc')body=mCalc(M);else if(M.t==='ref')body=mRef(M);else if(M.t==='mat')body=mMat(M);else if(M.t==='emb')body=mEmb(M);
  else if(M.t==='reserva')body=mReserva(M);else if(M.t==='obs')body=mObs(M);else if(M.t==='emp')body=mEmp(M);else if(M.t==='user')body=mUser(M);else if(M.t==='plantSave')body=mPlantSave(M);else if(M.t==='plantEdit')body=mPlantEdit(M);else if(M.t==='nuevaDesde')body=mNuevaDesde(M);else if(M.t==='alerta')body=mAlerta(M);else if(M.t==='impLista')body=mImpLista(M);else if(M.t==='novedades')body=mNovedades(M);else if(M.t==='mejResp')body=mMejResp(M);else if(M.t==='avisoRes')body=mAvisoRes(M);else if(M.t==='bsu')body=mBSU(M);else if(M.t==='fotoRes')body=mFotoRes(M);else if(M.t==='avisoBSU')body=mAvisoBSU(M);else if(M.t==='impEmb')body=mImpEmb(M);else if(M.t==='tpl')body=mTpl(M);
  else if(M.t==='foto')body=`<h2>Foto referencial</h2>${M.src?`<img src="${esc(M.src)}" style="max-width:100%;border-radius:8px">`:'Cargando…'}<div class="mfoot"><button class="btn" data-act="closeM">Cerrar</button></div>`;
  else if(M.t==='asignar')body=mAsignar(M);else if(M.t==='confirm')body=`<h2>${esc(M.title)}</h2><p>${esc(M.msg)}</p><div class="mfoot"><button class="btn" data-act="closeM">Cancelar</button><button class="btn ${M.danger?'d':'p'}" data-act="confirmOK">${esc(M.ok||'Aceptar')}</button></div>`;
  else if(M.t==='info')body=`<h2>${esc(M.title)}</h2><div>${M.html}</div><div class="mfoot"><button class="btn p" data-act="closeM">Entendido</button></div>`;
  return `<div class="ov" data-act="ovClick"><div class="modal ${M.wide?'w':''}" data-stop="1">${body}</div></div>`}
function calcOut(calc,vals){const vars={...calc.consts,N:1};const warns=[];
  for(const k of calc.inputs){const v=vals[k]||{};if(INPUTS[k]&&INPUTS[k].dim){if(v.v===''||v.v==null)return {err:'Ingrese '+INPUTS[k].label.toLowerCase()};vars[k]=toM(v.v,v.u);const w=dimWarn(k,v.v,v.u,calc);if(w)warns.push(w)}else vars[k]=num(v.v)||(k==='N'?1:0)}
  try{const r=evalFormula(calc.formula,vars);return {r:Math.round(r*1000)/1000,warns,vars}}catch(e){return {err:e.message}}}
function mCalc(M){const m=M.mat,c=M.calc,o=calcOut(c,M.vals);
  return `<h2>Calcular cantidad — ${esc(m.desc)}</h2><div class="small muted" style="margin-bottom:10px">Código <span class="mono">${esc(m.codigo)}</span> · Fórmula <span class="formula">${esc(c.formula)}</span> · ${esc(constsTxt(c.consts))}</div>
  <div class="grid g3">${c.inputs.map(k=>{const d=INPUTS[k]||{label:k},v=M.vals[k]||{};return `<div><label>${esc(d.label)}</label><div class="row" style="flex-wrap:nowrap"><input inputmode="decimal" data-b="modal.vals.${k}.v" data-rr="1" value="${esc(v.v??'')}">${d.dim?`<select style="width:92px;flex-shrink:0" data-b="modal.vals.${k}.u" data-rr="1">${['mm','cm','m'].map(u=>`<option ${v.u===u?'selected':''}>${u}</option>`).join('')}</select>`:''}</div></div>`}).join('')}</div>
  ${o.err?`<div class="warn">${esc(o.err)}</div>`:`<div style="margin-top:14px"><span class="muted small">Resultado</span><div class="result">${fmt(o.r)} <span style="font-size:16px">${esc(m.um)}</span></div>${o.warns.map(w=>`<div class="warn">⚠ ${esc(w)}</div>`).join('')}</div>`}
  <div class="mfoot"><button class="btn" data-act="closeM">Cancelar</button><button class="btn p" data-act="calcOK" ${o.err?'disabled':''}>Usar ${o.err?'':fmt(o.r)+' '+esc(m.um)}</button></div>`}
function mRef(M){return `<h2>Material referencial (sin código)</h2><p class="small muted" style="margin-top:-8px">Describa el material lo mejor posible. El planificador le asignará el código SAP antes de la carga.</p>

async function guardarUsuarioDemo(v,pw,isNew){const id=v.id;const prev=S.cuentas.find(c=>c.id===id);
  await setDoc('cuentas/'+id,{nombre:v.nombre.trim(),rol:v.rol,empresaId:v.empresaId||'',activo:v.activo!=='0',creado:(prev&&prev.creado)||nowISO(),actualizado:nowISO()});
  const cr=clone(S.creds[id]||{});delete cr.id;Object.assign(cr,{correo1:(v.correo1||'').trim(),correo2:(v.correo2||'').trim(),correo3:(v.correo3||'').trim(),actualizado:nowISO()});
  if(pw){cr.salt=rid()+rid();cr.hash=await hashPw(pw,cr.salt)}
  await setDoc('credenciales/'+id,cr);if(pw)await setDoc('claves/adm-'+id,{usuario:id,clave:pw,t:nowISO()}).catch(()=>{})}
async function iniciarSesionDemo(u,pw){S.loginErr='';u=String(u||'').trim().toLowerCase();if(!u||!pw){S.loginErr='Ingrese usuario y contraseña.';render();return}
  if(!S.uid){S.loginErr='Debe iniciar sesión en claude.ai para usar la app.';render();return}
  S.loggingIn=u;render();
  try{const c=S.cuentas.find(x=>x.id===u),cr=S.creds[u];await sleep(300);
    if(!c||!cr||!cr.salt||(await hashPw(pw,cr.salt))!==cr.hash){S.loginErr='Usuario o contraseña incorrectos.';return}
    if(c.activo===false){S.loginErr='Este usuario está desactivado. Consulte al administrador.';return}
    await setDoc('sesiones/'+S.uid,{usuario:u,tag:cr.hash.slice(0,16),t:nowISO()});S.sesion={usuario:u,tag:cr.hash.slice(0,16)};S.cuenta=u;S.view='inicio';S.novChecked=false}
  catch(e){S.loginErr='No se pudo ingresar: '+(e.message||e.code||e)}finally{S.loggingIn=null;afterData();render()}}

  if(!para.length){toast('No hay correos del personal de diseño (Gestión → Correos): no se generó la alerta.');return}
  const {asunto,cuerpo}=alertaTexto(d);const id=newId('notificaciones');
  const n={solicitudId:d.id,embarcacion:d.header.proyecto,para,cc,asunto,cuerpo,estado:'pendiente',creado:nowISO(),por:S.cuenta};
  await setDoc('notificaciones/'+id,n).catch(()=>{});d.alertaId=id;await saveDraft(null,true).catch(()=>{});
  S.modal={t:'alerta',n:{id,...n}};render()}

async function saveDraft(msg,quiet){const s=S.draft;s.updatedAt=nowISO();if(EN_CURSO.includes(s.estado)&&completaRes(s)){s.estado='Reservada';hist(s,'Todos los materiales con reserva: pasa a Reservada')}if(msg)hist(s,msg);
  const body=clone(s);delete body.id;S.dirty=false;clearTimeout(autoT);await setDoc('solicitudes/'+s.id,body);S.isNew=false;S.lastAuto=quiet?new Date():null;if(quiet)refreshSide();else render();}

function dirtyTxt(){return S.dirty?'Cambios sin guardar…':(S.lastAuto?'Guardado automáticamente '+S.lastAuto.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}):'')}

function openCalc(m,i){const c=m.calc;const vals={};c.inputs.forEach(k=>vals[k]={v:k==='N'?'1':'',u:'mm'});
  if(i!=null){const it=S.draft.items[i];if(it.calc&&it.calc.vals)Object.assign(vals,clone(it.calc.vals));else{const p=parseObs(it.obs);if(p){if(vals.L)vals.L={v:fmt(p.L*1000),u:'mm'};if(vals.A&&p.A!=null)vals.A={v:fmt(p.A*1000),u:'mm'};if(vals.D)vals.D={v:fmt(p.L*1000),u:'mm'}}}}

async function resizeImg(file){const url=URL.createObjectURL(file);const img=await new Promise((r,j)=>{const im=new Image();im.onload=()=>r(im);im.onerror=j;im.src=url});
  const k=Math.min(1,640/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);return cv.toDataURL('image/jpeg',0.6)}

  (solo||s.items||[]).forEach(it=>rows.push([asNum(it.codigo),it.desc,it.um,fmt(it.cantidad),it.obs||null,asNum(it.reserva),asNum(it.posicion),(EST_SAP.includes(it.estado||'')?null:it.estado)||null,h.proyecto,h.sistema,asNum(h.grafo),asNum(h.pos),e.nombre||h.empresaTxt||'',e.correo1||'',e.correo2||'',e.correo3||'',h.consideraciones||'',new Date(s.fechaSolicitud),s.fechaCarga||dmy(new Date()),h.nombreActividad||'',ultimaPos(h)]));
  const ws=XLSX.utils.aoa_to_sheet(rows,{cellDates:true});for(let r=2;r<=rows.length;r++){const c=ws['R'+r];if(c)c.z='yyyy-mm-dd hh:mm:ss'}

  if(el.dataset.act==='ovClick'){ACT.ovClick(el,ev);return}if(el.closest('[data-stop]')&&!el.closest('.modal [data-act]'))return;

  if(el.id==='msearch')return liveMat(el);if(el.id==='asearch'){S.modal.codigo=el.value;return liveAsig(el)}

  if(el.dataset.ch&&CH[el.dataset.ch]){CH[el.dataset.ch](el);return}
  if(el.dataset.b){setPath(S,el.dataset.b,el.type==='checkbox'?el.checked:el.value);if(el.dataset.b.startsWith('draft.')){S.dirty=true;autoSaveSoon()}if(el.tagName==='SELECT'||el.type==='checkbox'||el.dataset.rr)render()}});

const FB={};
const NCH=8;
const chunkOf=c=>{let h=0;for(const ch of String(c))h=(h*31+ch.charCodeAt(0))>>>0;return 'c'+(h%NCH)};
const DOM=()=>String(window.DOMINIO_USUARIOS||'pedidos-tasa.app').trim();
const em=u=>String(u).trim().toLowerCase()+'@'+DOM();
function errMsg(e){const c=(e&&e.code)||'';
  if(/wrong-password|invalid-credential|user-not-found|invalid-login/.test(c))return 'Usuario o contraseña incorrectos.';
  if(/too-many-requests/.test(c))return 'Demasiados intentos. Espere unos minutos e intente de nuevo.';
  if(/network-request-failed/.test(c))return 'Sin conexión. Revise su internet.';
  if(/email-already-in-use/.test(c))return 'Ese usuario ya existe.';
  if(/weak-password/.test(c))return 'La contraseña debe tener al menos 6 caracteres.';
  if(/permission-denied/.test(c))return 'Sin permiso para esta acción con su rol.';
  return (e&&e.message)||String(e)}
/* Adaptador: el catálogo vive en 8 documentos (catalogo/c0..c7) para gastar pocas lecturas */
function fbAdapter(db){
  const FP=(...k)=>new firebase.firestore.FieldPath(...k);
  const matRef=code=>({id:code,path:'materiales/'+code,
    async set(data){if(data&&data.ref)return db.doc('materiales/'+code).set(data);const d=clone(data);delete d.id;
      const ref=db.doc('catalogo/'+chunkOf(code));try{await ref.update(FP('items',code),d)}catch(e){if(e&&e.code==='not-found')await ref.set({items:{[code]:d}},{merge:true});else throw e}},
    async delete(){const m=S.materiales.find(x=>x.id===code);if(m&&m.ref)return db.doc('materiales/'+code).delete();
      try{await db.doc('catalogo/'+chunkOf(code)).update(FP('items',code),firebase.firestore.FieldValue.delete())}catch(e){if(!(e&&e.code==='not-found'))throw e}},
    get:()=>db.doc('materiales/'+code).get()});
  return {doc:p=>p.startsWith('materiales/')?matRef(p.slice(11)):db.doc(p),collection:p=>db.collection(p),raw:db}}

let subs=[],solKey='',chunks={},refDocs=[];
function stopSubs(){subs.forEach(u=>{try{u()}catch(e){}});subs=[];solKey='';chunks={};refDocs=[]}
function resetData(){Object.assign(S,{materiales:[],embarcaciones:[],solicitudes:[],empresas:[],cuentas:[],creds:{},claves:[],plantSol:[],notifs:[],rolesCfg:null,periodos:null,cargos:null,plantillas:null,loaded:{},draft:null,dirty:false,modal:null,viewAs:null})}
function rebuildMat(){S.materiales=[...Object.values(chunks).flatMap(it=>Object.entries(it||{}).map(([code,d])=>({...d,id:code,codigo:code}))),...refDocs]}
function subscribeFB(){const db=FB.raw;const t=setTimeout(()=>{S.stale=true;render()},10000);
  const done=k=>{S.loaded[k]=1;if(Object.keys(S.loaded).length>=6){clearTimeout(t);S.stale=false}};
  const fail=k=>e=>{console.warn(k,e);done(k);if(e&&e.code==='permission-denied')toast('Sin permiso para leer '+k,'bad');afterData()};
  const col=(name,key,map)=>subs.push(db.collection(name).onSnapshot(sn=>{const l=sn.docs.map(d=>({...d.data(),id:d.id}));if(map)map(l);else S[key]=l;if(!sn.metadata.fromCache)done(key);afterData()},fail(key)));
  col('catalogo','cat',l=>{chunks={};l.forEach(d=>chunks[d.id]=d.items||{});rebuildMat()});
  col('materiales','refs',l=>{refDocs=l;rebuildMat()});
  col('embarcaciones','embarcaciones');col('empresas','empresas');col('plantillasSol','plantSol');col('notificaciones','notifs');col('mejoras','mejoras');
  subs.push(db.doc('botEstado/estado').onSnapshot(sn=>{S.bot=sn.exists?sn.data():null;afterData()},()=>{}));
  col('cuentas','cuentas',l=>{S.cuentas=l;const m={};l.forEach(c=>m[c.id]=c);S.creds=m});
  col('rolesCfg','rolesCfg',l=>{S.rolesCfg=l.sort((a,b)=>(a.orden??99)-(b.orden??99)).map(r=>({id:r.id,nombre:r.nombre,permisos:r.permisos||[]}))});
  if(S.me&&S.me.rol==='admin')col('claves','claves');
  subs.push(db.doc('config/ajustes').onSnapshot(sn=>{S.ajustes=sn.exists?clone(sn.data()):null;afterData()},()=>{}));['plantillas','periodos','cargos','unidades','diseno'].forEach(id=>subs.push(db.doc('config/'+id).onSnapshot(sn=>{S[id==='plantillas'?'plantillas':id]=sn.exists?clone(sn.data().list):null;afterData()},()=>{})))}
function ensureSolSub(){if(!S.loaded.rolesCfg||!S.loaded.cuentas)return;const c=S.cuentas.find(x=>x.id===S.cuenta);if(!c)return;
  const r=rolBy(c.rol);const todas=c.rol==='admin'||(r&&(r.permisos||[]).includes('ver_todas'));const key=c.rol+'|'+(c.empresaId||'')+'|'+todas;if(key===solKey)return;
  if(S.solUnsub)S.solUnsub.forEach(u=>u());S.solUnsub=[];solKey=key;const db=FB.raw;
  const parts={};S.pendIds=new Set();const push=(k,sn)=>{S.offline=sn.metadata.fromCache;sn.docs.forEach(d=>{if(d.metadata.hasPendingWrites)S.pendIds.add(d.id);else S.pendIds.delete(d.id)});parts[k]=sn.docs.map(d=>({...d.data(),id:d.id}));const m=new Map();Object.values(parts).forEach(l=>l.forEach(x=>m.set(x.id,x)));S.solicitudes=[...m.values()];S.loaded.solicitudes=1;afterData()};
  const err=e=>{console.warn('solicitudes',e);S.loaded.solicitudes=1;afterData()};
  if(todas)S.solUnsub.push(db.collection('solicitudes').onSnapshot({includeMetadataChanges:true},sn=>push('all',sn),err));
  else{S.solUnsub.push(db.collection('solicitudes').where('createdBy','==',S.cuenta).onSnapshot({includeMetadataChanges:true},sn=>push('mias',sn),err));
    if(c.empresaId)S.solUnsub.push(db.collection('solicitudes').where('empresaId','==',c.empresaId).onSnapshot({includeMetadataChanges:true},sn=>push('emp',sn),err))}
  subs.push(()=>{(S.solUnsub||[]).forEach(u=>u());S.solUnsub=[]})}

    let pw=u.clave&&u.clave.length>=6?u.clave:'';if(!pw){pw=genPw();avisos.push(`${u.usuario}: nueva contraseña ${pw}`)}
    try{await conSecundaria(async a=>{try{await a.createUserWithEmailAndPassword(em(u.usuario),pw)}catch(e){if(e&&e.code==='auth/email-already-in-use')await a.signInWithEmailAndPassword(em(u.usuario),pw);else throw e}})}
    catch(e){avisos.push(`${u.usuario}: no se pudo crear el acceso (${errMsg(e)})`);continue}
    await db.doc('cuentas/'+u.usuario).set({nombre:u.nombre||u.usuario,rol:u.rol||'solicitante',empresaId:u.empresaId||'',activo:u.activo!==false,correo1:u.correo1||'',correo2:u.correo2||'',correo3:u.correo3||'',creado:nowISO(),actualizado:nowISO(),ultimoIngreso:''});
    await db.doc('claves/'+u.usuario).set({usuario:u.usuario,clave:pw,t:nowISO(),por:'admin'});await sleep(150)}
  /* 2. Roles y configuración */
  prog('Roles y configuración…');{const b=db.batch();(D.roles||[]).forEach((r,k)=>b.set(db.doc('rolesCfg/'+r.id),{nombre:r.nombre,permisos:r.id==='admin'?Object.keys(PERMS):(r.permisos||[]),orden:k}));
    for(const k of ['plantillas','periodos','cargos','unidades','diseno'])if(D.config&&D.config[k])b.set(db.doc('config/'+k),{list:D.config[k]});await b.commit()}
  /* 3. Catálogo en bloques */
  prog('Catálogo de materiales…');const porChunk={};const refs=[];for(const m of D.materiales||[]){const o=clone(m);const id=o.id;delete o.id;if(o.ref)refs.push([id,o]);else{const c=String(o.codigo||id);(porChunk[chunkOf(c)]=porChunk[chunkOf(c)]||{})[c]=o}}
  for(const [k,items] of Object.entries(porChunk))await db.doc('catalogo/'+k).set({items},{merge:true});
  /* 4. Colecciones */
  const lotes=async(col,list)=>{for(let k=0;k<list.length;k+=400){const b=db.batch();list.slice(k,k+400).forEach(([id,o])=>b.set(db.doc(col+'/'+id),clone(o)));await b.commit();prog(`${col}: ${Math.min(k+400,list.length)}/${list.length}…`)}};
  const pares=l=>(l||[]).map(x=>{const o=clone(x);const id=o.id;delete o.id;return [id,o]});
  await lotes('materiales',refs);await lotes('empresas',pares(D.empresas));await lotes('embarcaciones',pares(D.embarcaciones));
  await lotes('plantillasSol',pares(D.plantillasSol));await lotes('notificaciones',pares(D.notificaciones));await lotes('solicitudes',pares(D.solicitudes));await lotes('mejoras',pares(D.mejoras));
  /* 5. Fotos */
  const F=Object.entries(D.fotos||{});let n=0;for(const [id,data] of F){await db.doc('fotos/'+id).set({data});n++;prog(`Fotos ${n}/${F.length}…`)}
  prog(`Importación completa.${avisos.length?' Revise: '+avisos.join(' · '):''}`)}
  catch(e){prog('Se detuvo: '+errMsg(e)+(avisos.length?' · '+avisos.join(' · '):''))}
  render()}

/* Aviso de nueva versión publicada en GitHub (evita trabajar con una copia vieja en caché) */
async function revisarVersion(){if(!S.fb||S.nuevaVersion||location.protocol==='file:')return;try{const r=await fetch(location.href.split('#')[0]+(location.search?'&':'?')+'v='+Date.now(),{cache:'no-store'});const t=await r.text();const m=t.match(/const BUILD='([^']+)'/);
  if(m&&m[1]!==BUILD){S.nuevaVersion=m[1];schedule()}}catch(e){}}
setInterval(revisarVersion,5*60*1000);setInterval(()=>{if(S.bot&&(S.view==='inicio'||S.gTab==='bot')&&!S.modal&&!S.tour&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render()},60000);setTimeout(revisarVersion,15000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')revisarVersion()});
async function boot(){const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||!window.firebase){if(window.claude&&window.claude.use)return bootClaude();S.demo=true;S.db=memDB();S.uid='demo';S.owner=true;await seedDemo(S.db);S.boot='ok';subscribeDemo();render();return}
  S.fb=true;firebase.initializeApp(cfg);FB.auth=firebase.auth();const fs=firebase.firestore();
  try{fs.settings({experimentalForceLongPolling:true,merge:true})}catch(e){console.warn(e)}
  try{await fs.clearPersistence()}catch(e){}
  window.addEventListener('online',()=>{S.offline=false;schedule()});window.addEventListener('offline',()=>{S.offline=true;schedule()});
  FB.raw=fs;S.db=fbAdapter(fs);
  const sec=firebase.initializeApp(cfg,'secundaria');FB.secAuth=sec.auth();try{await FB.secAuth.setPersistence(firebase.auth.Auth.Persistence.NONE)}catch(e){}
  try{const sn=await fs.doc('config/sistema').get();S.inicializado=sn.exists}catch(e){S.inicializado=true;console.warn(e)}
  S.boot='ok';render();FB.auth.onAuthStateChanged(u=>onAuth(u))}

boot();
</script>
